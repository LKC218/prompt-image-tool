<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#FFFDF8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="version" content="2.5.27">
    <title>提示词管家</title>
    <link rel="icon" type="image/svg+xml" href="./assets/icons/图标.svg">
    <style>
        @font-face {
            font-family: '庞门正道细线体';
            src: url('./assets/fonts/庞门正道细线体.ttf') format('truetype');
            font-display: swap;
        }
        .splash-screen {
            position: fixed;
            inset: 0;
            background: #FFFDF8;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.4s ease;
            overflow: hidden;
        }
        .splash-screen.splash-hide {
            opacity: 0;
            pointer-events: none;
        }
        .splash-pixel-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            pointer-events: none;
        }
        .splash-content {
            text-align: center;
            position: relative;
            z-index: 1;
        }
        .splash-pixel-stage {
            position: relative;
            width: 96px;
            height: 96px;
            margin: 0 auto 16px;
        }
        .splash-icon {
            position: absolute;
            inset: 0;
            width: 64px;
            height: 64px;
            margin: 16px;
            opacity: 0;
            transform: scale(0.94);
        }
        .splash-icon.splash-icon-ready {
            opacity: 1;
            transform: scale(1);
            transition: opacity 0.22s ease, transform 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .splash-title {
            font-size: 20px;
            font-weight: 700;
            color: #342721;
            font-family: '庞门正道细线体', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            opacity: 0;
            transform: translateY(8px);
        }
        .splash-title.splash-title-ready {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.35s ease, transform 0.35s ease;
        }
        @media (prefers-reduced-motion: reduce) {
            .splash-pixel-canvas {
                display: none;
            }
            .splash-icon {
                opacity: 1;
                transform: none;
            }
            .splash-title {
                opacity: 1;
                transform: none;
            }
        }
        #pcApp { display: none; }
        #mobileApp { display: none; }
    </style>
</head>
<body>
    <div id="splashScreen" class="splash-screen">
        <canvas id="splashPixelCanvas" class="splash-pixel-canvas" aria-hidden="true"></canvas>
        <div class="splash-content">
            <div class="splash-pixel-stage">
                <img src="./assets/icons/图标.svg" alt="" class="splash-icon" id="splashIcon">
            </div>
            <div class="splash-title" id="splashTitle">提示词管家</div>
        </div>
    </div>
    <div id="pcApp"></div>
    <div id="mobileApp"></div>
    <script>
        (function () {
            var LOGO_CSS = 64;
            var GRID = 24;
            var DURATION_MS = 2200;
            var EDGE_PAD = 12;
            var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            var iconEl = document.getElementById('splashIcon');
            var titleEl = document.getElementById('splashTitle');
            var canvas = document.getElementById('splashPixelCanvas');
            // 优先用 <img> 上经 Vite 改写后的真实地址；硬编码路径在 dist 会被 hash 改名导致 onerror 跳过动画
            var LOGO_SRC = (iconEl && (iconEl.currentSrc || iconEl.src)) || './assets/icons/图标.svg';
            var settled = false;
            var settleResolve;
            var settlePromise = new Promise(function (resolve) {
                settleResolve = resolve;
            });

            function settle() {
                if (settled) return;
                settled = true;
                if (iconEl) iconEl.classList.add('splash-icon-ready');
                if (titleEl) titleEl.classList.add('splash-title-ready');
                if (canvas) {
                    canvas.style.transition = 'opacity 0.24s ease';
                    canvas.style.opacity = '0';
                }
                settleResolve();
            }

            window.__splashPlay = function () {
                return settlePromise;
            };

            if (reduced || !canvas || !canvas.getContext) {
                settle();
                return;
            }

            var dpr = Math.min(window.devicePixelRatio || 1, 2);
            var viewW = window.innerWidth || document.documentElement.clientWidth || 1280;
            var viewH = window.innerHeight || document.documentElement.clientHeight || 720;
            canvas.width = Math.max(1, Math.round(viewW * dpr));
            canvas.height = Math.max(1, Math.round(viewH * dpr));

            var ctx = canvas.getContext('2d');
            var img = new Image();
            img.decoding = 'async';

            function edgeSpawn() {
                var side = (Math.random() * 8) | 0;
                var w = viewW;
                var h = viewH;
                var pad = EDGE_PAD;
                if (side === 0) return { x: Math.random() * w, y: -pad - Math.random() * 40 };
                if (side === 1) return { x: Math.random() * w, y: h + pad + Math.random() * 40 };
                if (side === 2) return { x: -pad - Math.random() * 40, y: Math.random() * h };
                if (side === 3) return { x: w + pad + Math.random() * 40, y: Math.random() * h };
                if (side === 4) return { x: -pad - Math.random() * 60, y: -pad - Math.random() * 60 };
                if (side === 5) return { x: w + pad + Math.random() * 60, y: -pad - Math.random() * 60 };
                if (side === 6) return { x: -pad - Math.random() * 60, y: h + pad + Math.random() * 60 };
                return { x: w + pad + Math.random() * 60, y: h + pad + Math.random() * 60 };
            }

            img.onerror = function () {
                settle();
            };

            img.onload = function () {
                var sample = document.createElement('canvas');
                sample.width = GRID;
                sample.height = GRID;
                var sctx = sample.getContext('2d');
                sctx.clearRect(0, 0, GRID, GRID);
                sctx.drawImage(img, 0, 0, GRID, GRID);
                var data;
                try {
                    data = sctx.getImageData(0, 0, GRID, GRID).data;
                } catch (e) {
                    settle();
                    return;
                }

                var logoLeft = (viewW - LOGO_CSS) / 2;
                var logoTop = (viewH - LOGO_CSS) / 2 - 18;
                var cell = LOGO_CSS / GRID;
                var particles = [];
                var i;
                for (i = 0; i < GRID * GRID; i++) {
                    var gx = i % GRID;
                    var gy = (i / GRID) | 0;
                    var a = data[i * 4 + 3];
                    if (a < 18) continue;
                    var r = data[i * 4];
                    var g = data[i * 4 + 1];
                    var b = data[i * 4 + 2];
                    var spawn = edgeSpawn();
                    particles.push({
                        tx: (logoLeft + gx * cell) * dpr,
                        ty: (logoTop + gy * cell) * dpr,
                        sx: spawn.x * dpr,
                        sy: spawn.y * dpr,
                        color: 'rgba(' + r + ',' + g + ',' + b + ',' + Math.max(0.55, a / 255) + ')',
                        delay: Math.random() * 520,
                        size: cell * dpr * (0.92 + Math.random() * 0.18)
                    });
                }

                if (!particles.length) {
                    settle();
                    return;
                }

                var start = performance.now();
                var duration = DURATION_MS;

                function frame(now) {
                    var elapsed = now - start;
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    for (var p = 0; p < particles.length; p++) {
                        var item = particles[p];
                        var t = (elapsed - item.delay) / duration;
                        if (t < 0) t = 0;
                        if (t > 1) t = 1;
                        var e = 1 - Math.pow(1 - t, 3);
                        var px = item.sx + (item.tx - item.sx) * e;
                        var py = item.sy + (item.ty - item.sy) * e;
                        var alpha = 0.12 + 0.88 * e;
                        ctx.globalAlpha = alpha;
                        ctx.fillStyle = item.color;
                        ctx.fillRect(px, py, item.size, item.size);
                    }

                    ctx.globalAlpha = 1;

                    if (elapsed < duration + 320) {
                        requestAnimationFrame(frame);
                    } else {
                        settle();
                    }
                }

                requestAnimationFrame(frame);
                setTimeout(function () {
                    if (titleEl) titleEl.classList.add('splash-title-ready');
                }, Math.round(duration * 0.78));
            };

            img.src = LOGO_SRC;
        })();
    </script>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
